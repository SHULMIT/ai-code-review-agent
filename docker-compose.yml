services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review_agent
      POSTGRES_PASSWORD: review_agent
      POSTGRES_DB: review_agent
    ports:
      - "5432:5432"
    volumes:
      - review_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review_agent"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  review_agent_postgres_data:
